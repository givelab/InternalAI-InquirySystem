version: "3"

services:
  db:
    container_name: db
    image: postgres:15.3
    volumes:
      - backend_db_data:/var/lib/postgresql/data
      - ./db/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_ROOT_PASSWORD: root
      POSTGRES_MULTIPLE_DATABASES: backend_app
    command: ["postgres", "-c", "log_destination=stderr", "-c", "log_statement=all", "-c", "log_connections=on", "-c", "log_disconnections=on"]

  backend:                 # ← サービス名を "backend" に変更
    # "container_name: backend" はしばしば衝突の原因に
    # できれば一旦削除 or コメントアウトすると吉
    # container_name: backend
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    ports:
      - "8000:8000"  # 同じ番号に揃える
    # fastapi起動時に uvicorn --host=0.0.0.0 --port=8000 などで立ち上げる
    volumes:
      - ../src:/app/src
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_NAME: backend_app
    depends_on:
      - db

  frontend:
    container_name: frontend
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
    # ホスト側の ../frontend ディレクトリをコンテナ内 /app にマウント
    # これで app.py 等を変更すると即コンテナに反映され、Streamlitがリロード
      - ../../frontend:/app
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend  # ← service 名と一致した
      - db

volumes:
  backend_db_data:
    driver: local
